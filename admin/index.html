<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMIN</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  <body>
    <section id="log"></section>
    <section id="addMovie"></section>
    <section id="addProfile"></section>
    <section id="ModifyProfile"></section>

    <script type="module">
      import { Log } from "./component/Log/script.js";

      import { MovieForm } from "./component/MovieForm/script.js";
      import { DataMovie } from "./data/dataMovie.js";

      import { ProfileForm } from "./component/ProfileForm/script.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { ModifyProfile } from "./component/ModifyProfile/script.js";

      window.C = {};

      C.handlerAddMovie = async function () {
        let form = document.querySelector(".addFilm__form");
        let fd = new FormData(form);

        let res = await DataMovie.add(fd);
        V.renderLog(res);
      };

      C.handlerAddProfile = async function () {
        let form = document.querySelector(".addProfile__form");

        let fd = new FormData(form); // Declare and initialize the FormData object
        let res = await DataProfile.addProfile(fd);
        V.renderLog(res);
      };

      C.handlerProfileModify = async function () {
        const form = document.querySelector(".modifyProfile__form");

        if (!form) {
          console.error("Form with class 'modifyProfile__form' not found.");
          return;
        }

        const fd = new FormData(form);
        const res = await DataProfile.modify(fd);
        V.renderLog(res);
      };

      C.handlerProfileSelect = function () {
        const select = document.querySelector("#profile-select");
        const selectedOption = select.options[select.selectedIndex];

        if (selectedOption) {
          // Récupère les données du profil sélectionné
          const profileName = selectedOption.dataset.name || "";
          const profileAvatar = selectedOption.dataset.avatar || "";
          const profileMinAge = selectedOption.dataset.age || "";

          // Met à jour les champs du formulaire
          document.querySelector("input[name='name']").value = profileName;
          document.querySelector("input[name='avatar']").value = profileAvatar;
          document.querySelector("input[name='min_age']").value = profileMinAge;
        }
      };

      C.start = async function () {
        V.renderLog("Démarrage de l'application");
        V.renderAddMovie("C.handlerAddMovie()");
        V.renderAddProfile("C.handlerAddProfile()");
        let profiles = await DataProfile.read();
        V.renderModifyProfile(profiles);
      };

      window.V = {};

      V.renderLog = function (txt) {
        let content = document.querySelector("#log");
        content.innerHTML = Log.format(txt);
      };

      V.renderAddMovie = function (handler) {
        let content = document.querySelector("#addMovie");
        content.innerHTML = MovieForm.format(handler);
      };

      V.renderAddProfile = async function (handler) {
        let content = document.querySelector("#addProfile");
        let profiles = await DataProfile.getProfiles();
        content.innerHTML = ProfileForm.format(profiles, handler);
      };

      V.renderModifyProfile = function (data) {
        let content = document.querySelector("#ModifyProfile");
        content.innerHTML = ModifyProfile.format(data);
      };

      C.start();
    </script>
  </body>
</html>
