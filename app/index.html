<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <header id="header"></header>

    <section class="cards" id="content"></section>
    <section class="infos" id="infos"></section>
    <section class="category" id="category"></section>
    <div id="categories"></div>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { Movie } from "./component/Movie/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { MovieDetail } from "./component/movieDetail/script.js";
      import { MovieCategory } from "./component/movieCategory/script.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { Favoris } from "./component/Favoris/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.profile = null; // Variable pour stocker le profil sélectionné

      C.handlerAbout = function () {
        C.getMovie();
      };

      C.handlerDetail = async function (movieId) {
        let movieData = await DataMovie.requestMovieDetails(movieId); // Récupère les détails du film
        V.renderMovieDetail(movieData); // Affiche les détails du film
      };

      C.handlerProfile = async function () {
        const select = document.querySelector("#profile-select");
        let dataProfile = await DataProfile.readOne(select.value);
        C.profile = dataProfile[0];
        C.getMovie(C.profile.min_age);

        const profileImage = document.querySelector("#profile-image");

        if (profileImage && C.profile.avatar) {
          profileImage.src = `../server/images/${C.profile.avatar}`;
        }
      };

      C.handlerFavorisList = async function () {
        // Récupérer l'ID du profil actif
        const profileSelect = document.querySelector("#profile-select");
        const profileId = profileSelect ? profileSelect.value : null;

        if (!profileId) {
          alert("Veuillez sélectionner un profil pour voir les favoris.");
          return;
        }

        // Récupérer les films favoris pour le profil actif
        let favoris = await DataMovie.getFavoris(profileId);

        if (!favoris || favoris.length === 0) {
          document.querySelector("#content").innerHTML =
            "<p>Aucun film ajouté aux favoris.</p>";
        } else {
          // Afficher les films favoris
          V.renderMovie(favoris);
        }
      };

      C.handlerFavoris = async function (element) {
        const movieId = element.dataset.movieId; // récupère l'attribut data-movie-id
        console.log(`C.handlerFavoris appelé avec movieId=${movieId}`);

        const profileSelect = document.querySelector("#profile-select");
        const profileId = profileSelect ? profileSelect.value : null;

        if (!profileId) {
          alert(
            "Veuillez sélectionner un profil avant d'ajouter un film aux favoris."
          );
          return;
        }

        let res = await DataMovie.addFavoris(movieId, profileId);
        console.log("Réponse du serveur :", res);

        if (res === 1) {
          alert("Le film a été ajouté à vos favoris !");
        }
      };

      C.getMovie = async function (age) {
        let movies = await DataMovie.requestMovies(age);
        if (!Array.isArray(movies) || movies.length === 0) {
          document.querySelector("#content").innerHTML =
            "<p>Aucun film disponible pour votre tranche d'âge.</p>";
          return;
        }
        V.renderMoviesCategory(movies);
      };

      C.getCategories = async function () {
        if (!C.profile) {
          document.querySelector("#categories").innerHTML =
            "";
          return;
        }

        let categories = await DataMovie.requestMovies(99);
        if (!Array.isArray(categories) || categories.length === 0) {
          document.querySelector("#categories").innerHTML =
            "<p>Aucune catégorie disponible pour votre tranche d'âge.</p>";
          return;
        }
        V.renderMoviesCategory(categories); // Affiche les catégories
      };

      C.addFavoris = async function (id_movie) {
        if (!C.profile) {
          alert("Veuillez sélectionner un profil avant d'ajouter un favori.");
          return;
        }
        let response = await fetch(
          `https://mmi.unilim.fr/~onillon4/SAE2.03-Onillon/server/script.php?todo=addFavoris&id_profil=${C.profile.id}&id_movie=${id_movie}`
        );
        let result = await response.json();

        if (result.success) {
          alert("Ajouté aux favoris !");
          let button = document.querySelector(
            `button[onclick="C.addFavoris(${id_movie})"]`
          );
          if (button) {
            button.classList.add("is-favoris");
          }
        } else {
          alert(result.error || "Erreur lors de l'ajout aux favoris.");
        }
      };

      C.removeFavoris = async function (id_movie) {
        if (!C.profile) {
          alert(
            "Veuillez sélectionner un profil avant de supprimer un favori."
          );
          return;
        }
        let response = await fetch(
          `https://mmi.unilim.fr/~onillon4/SAE2.03-Onillon/server/script.php?todo=removeFavoris&id_profil=${C.profile.id}&id_movie=${id_movie}`
        );

        let result = await response.json();

        if (result.success) {
          alert("Supprimé des favoris !");
          C.showFavoris();
        } else {
          alert(result.error || "Erreur lors de la suppression du favori.");
        }
      };

      C.goHome = function () {
        if (C.profile) {
          C.getMovie(C.profile.age);
        } else {
          document.querySelector("#content").innerHTML =
            "<p>Veuillez sélectionner un profil.</p>";
        }
      };

      C.showFavoris = async function () {
        if (!C.profile) {
          alert("Veuillez sélectionner un profil.");
          return;
        }

        let response = await fetch(
          `https://mmi.unilim.fr/~onillon4/SAE2.03-Onillon/server/script.php?todo=readFavoris&id_profil=${C.profile.id}`
        );
        let favoris = await response.json();

        let content = document.querySelector("#content");
        if (!favoris || favoris.length === 0) {
          content.innerHTML = "<p>Votre liste de favoris est vide.</p>";
          return;
        }

        // Utilise maintenant Favoris.format
        content.innerHTML = Favoris.format(favoris);
      };


      C.start = async function () {
        let profiles = await DataProfile.read();
        V.renderNavBar("C.handlerAbout()", "C.handlerProfile()", profiles );
        // let moviesByCat = await DataMovie.requestMoviesByCategory();
        // V.renderMoviesCategory(moviesByCat);
        C.getMovie();
        C.getCategories();
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */

      V.renderNavBar = function (hAbout, hShowMovies, profiles) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout, hShowMovies, profiles);
      };

      V.renderMovie = function (data) {
        let content = document.querySelector("#content");
        content.innerHTML = Movie.format(data);
      };

      V.renderMovieDetail = function (movieData) {
        let content = document.querySelector("#content");
        content.innerHTML = MovieDetail.format(movieData);
      };

      V.renderMoviesCategory = function (data) {
        let content = document.querySelector("#content");
        let formattedContent = "";
        for (let category of data) {
          formattedContent += MovieCategory.format(category);
        }
        content.innerHTML = formattedContent;
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
<script type="module"></script>
